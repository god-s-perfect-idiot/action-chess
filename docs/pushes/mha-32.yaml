# MHA push — 32 NEW heroes only (approved piece types).
# Existing MHA left alone: deku, all-might, ingenium, red-riot, lemillion,
# todoroki, bakugo, hawks, overhaul.
source: My Hero Academia
version: 1
heroes:
  # --- Pawns ---
  - id: froppy
    codename: Froppy
    trueName: Tsuyu Asui
    piece: p
    gimmick: Frog
    look: Dark green bob, wide mouth, green frog-suit with pink accents, flipper boots
    blurb: Class 1-A’s deadpan amphibian — Frog lets her leap, cling, and lash with a tongue longer than a file. She bounds the pad on sticky pads, then snaps a tongue-hook that yanks and plants them for a ribbit-finish.
    stats: { pwr: 3, spd: 4, sty: 3 }
    motion:
      move: Bounding frog leaps between pads — hang time, then sticky land.
      fight: Tongue lash → pull-in → palm/kick plant.
      idle: Low crouch, head tilted, occasional blink — lookout perch.
    kit:
      locomotion: leap
      idle: lookout
      attack: pounce
      death: faceplant
      extras: [kneePads]
    refs:
      photo: https://static.wikia.nocookie.net/bokunoheroacademia/images/4/4a/Tsuyu_Asui_Hero_Costume_Action_2.png
      art: https://static.wikia.nocookie.net/bokunoheroacademia/images/8/8a/Tsuyu_Asui_Portrait.png
    needsSuit: true

  - id: pinky
    codename: Pinky
    trueName: Mina Ashido
    piece: p
    gimmick: Acid
    look: Pink skin/hair, yellow horns, white eye mask, purple/teal camo suit, tan fur-collar vest, purple boots
    blurb: Class 1-A’s acid dancer — she melts footholds and slides the file on corrosive soles. Acid spray softens the square; a spinning kick finishes whatever’s left standing.
    stats: { pwr: 3, spd: 4, sty: 5 }
    motion:
      move: Acid-slide run — corrosive slick cast ahead, skating strides.
      fight: Palm acid spray → melt dissolve.
      idle: Bouncy hip sway, horns tipped cocky.
    kit:
      locomotion: run
      idle: cocky
      attack: acidMelt
      death: dissolve
      extras: [pinkySuit]
    refs:
      photo: local:assets/image-9859386f-4d90-4549-9fcf-d00dc2b1e1ed.png
      art: public/roster/pinky.png
    needsSuit: true

  - id: cellophane
    codename: Cellophane
    trueName: Hanta Sero
    piece: p
    gimmick: Tape
    look: Black elbow-tape dispensers, yellow/black suit, taped smile
    blurb: Class 1-A’s tape artist — Cellophane shoots pressure tape from his elbows to swing the file and bind a capture. He zip-lines in, wraps the target, then yanks them into a tape-sling slam.
    stats: { pwr: 3, spd: 4, sty: 3 }
    motion:
      move: White elbow tape shot onto the next cell, yank-pull zip.
      fight: Tape yank-in slam → binding wrap.
      idle: Elbows out, tape tip twitching.
    kit:
      locomotion: leap
      idle: coolStand
      attack: tapeYank
      death: spinOut
      extras: [cellophaneSuit]
    refs:
      photo: https://static.wikia.nocookie.net/bokunoheroacademia/images/5/5a/Hanta_Sero_Hero_Costume_Action.png
      art: https://static.wikia.nocookie.net/bokunoheroacademia/images/1/1a/Hanta_Sero_Portrait.png
    needsSuit: true

  - id: grape-juice
    codename: Grape Juice
    trueName: Minoru Mineta
    piece: p
    gimmick: Pop Off
    look: Purple grape crown, half-mask, yellow cape-scarf, dark purple suit, grape-pod utility belt, yellow gauntlets/boots
    blurb: Class 1-A’s sticky-trap specialist — Pop Off peels adhesive grapes from his scalp and seeds the file. Targets lock down; he closes the gap and finishes whoever can’t peel free.
    stats: { pwr: 2, spd: 4, sty: 3 }
    motion:
      move: Short scurrying run, bouncing hops.
      fight: Sticky scalp-grape barrage → trap → close finish.
      idle: Boxer ready stance, hands near scalp orbs.
    kit:
      locomotion: run
      idle: boxer
      attack: grapePop
      death: crumple
      extras: [grapeBalls]
    refs:
      photo: https://static.wikia.nocookie.net/bokunoheroacademia/images/3/3d/Minoru_Mineta_Hero_Costume_Action.png
      art: https://static.wikia.nocookie.net/bokunoheroacademia/images/9/9a/Minoru_Mineta_Portrait.png
    needsSuit: false

  - id: anima
    codename: Anima
    trueName: Koji Koda
    piece: p
    gimmick: Anivoice
    look: Rock crest head, red/yellow mask, white shoulder pads, mouth-button emblem; summons birds to fight
    blurb: Class 1-A’s quiet beast-speaker — Anivoice summons animals that fight for him. He rides a called bird between pads, then a living tide crashes the square on his command.
    stats: { pwr: 3, spd: 3, sty: 2 }
    motion:
      move: Summons a bird and flies on it between pads.
      fight: Anivoice call → bird flock crashes the square.
      idle: Shy stance, mask tipped down.
    kit:
      locomotion: fly
      idle: shy
      attack: anivoice
      death: crumple
      extras: [animaSuit]
    refs:
      photo: https://static.wikia.nocookie.net/bokunoheroacademia/images/4/4c/Koji_Koda_Hero_Costume_Action.png
      art: https://static.wikia.nocookie.net/bokunoheroacademia/images/2/2b/Koji_Koda_Portrait.png
    needsSuit: false

